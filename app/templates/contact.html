<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="https://w7.pngwing.com/pngs/852/102/png-transparent-dialer-contact-list-contact-manager-android-android-blue-simple-mobile-phones-thumbnail.png">
    
<style>
    /* Toast Notification */
    .tNtf span {
      position: fixed;
      left: 24px;
      bottom: -70px;
      display: inline-flex;
      align-items: center;
      text-align: center;
      justify-content: center;
      margin-bottom: 20px;
      z-index: 99981;
      background: #323232;
      color: rgba(255, 255, 255, 0.8);
      font-size: 14px;
      font-family: inherit;
      border-radius: 3px;
      padding: 13px 2px;
      box-shadow: 0 5px 35px rgba(149, 157, 165, 0.3);
      opacity: 0;
      transition: all 0.1s ease;
      animation: slideinwards 2s ease forwards;
      -webkit-animation: slideinwards 2s ease forwards;
    }

    @media screen and (max-width: 500px) {
      .tNtf span {
        margin-bottom: 20px;
        left: 20px;
        right: 20px;
        font-size: 13px;
      }
    }

    @keyframes slideinwards {
      0% { opacity: 0; }
      20%, 50%, 80% { opacity: 1; bottom: 0; }
      100% { opacity: 0; bottom: -70px; visibility: hidden; }
    }

    @-webkit-keyframes slideinwards {
      0% { opacity: 0; }
      20%, 50%, 80% { opacity: 1; bottom: 0; }
      100% { opacity: 0; bottom: -70px; visibility: hidden; }
    }

    .drK .tNtf span {
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8f8f8;
    }

    .form-container {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    #telegram_form {
      width: 100%;
      max-width: 500px;
      background: #fff;
      padding: 25px;
      border-radius: 14px;
      border: 1px solid #ccc;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
    }

    label {
      display: block;
      font-weight: bold;
      color: #555;
      margin-top: 10px;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="file"],
    input[type="email"],
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 15px;
      margin-bottom: 16px;
      transition: border-color 0.3s ease-in-out;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
      max-height: 300px;
    }

    #submit {
      display: block;
      width: 100%;
      padding: 12px;
      margin-top: 20px;
      background-color: #5600FF;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      transition: background-color 0.3s ease-in-out;
    }

    #submit:hover {
      background-color: #3c00cc;
    }
  </style>
</head>

<body>
  <!--[ Toast Notification ]-->
  <div id="toast_notification" class="tNtf"></div>

  <div class="form-container">
    <!--[ Form ]-->
    <form id="telegram_form">
      <label for="name">Name*</label>
      <input name="name" type="text" placeholder="Name (required)" required />

      <label for="email">Email*</label>
      <input name="email" type="email" placeholder="Email Address (required)" required />

      <label for="files">Upload File</label>
      <input name="files" type="file" multiple />

      <label for="message">Message*</label>
      <textarea name="message" placeholder="Message must not contain more than 3000 characters (required)" maxlength="3000" required></textarea>

      <button id="submit" type="submit">Submit</button>
    </form>
  </div>
