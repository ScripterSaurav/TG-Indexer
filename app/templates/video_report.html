<!DOCTYPE html>
<html lang="en">
<head> 
<title>Report Video Page</title> 
<meta charset="UTF-8"> 
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">

<style>
  /*<![CDATA[*/
  /* Toast Notification */
  .tNtf span{position:fixed;left:24px;bottom:-70px;display:inline-flex;align-items:center;text-align:center;justify-content:center;margin-bottom:20px;z-index:99981;background:#323232;color:rgba(255,255,255,.8);font-size:14px;font-family:inherit;border-radius:3px;padding:13px 24px; box-shadow:0 5px 35px rgba(149,157,165,.3);opacity:0;transition:all .1s ease;animation:slideinwards 2s ease forwards;-webkit-animation:slideinwards 2s ease forwards}
  @media screen and (max-width:500px){.tNtf span{margin-bottom:20px;left:20px;right:20px;font-size:13px}}
  @keyframes slideinwards{0%{opacity:0}20%{opacity:1;bottom:0}50%{opacity:1;bottom:0}80%{opacity:1;bottom:0}100%{opacity:0;bottom:-70px;visibility:hidden}}
  @-webkit-keyframes slideinwards{0%{opacity:0}20%{opacity:1;bottom:0}50%{opacity:1;bottom:0}80%{opacity:1;bottom:0}100%{opacity:0;bottom:-70px;visibility:hidden}}
  .drK .tNtf span{box-shadow:0 10px 40px rgba(0,0,0,.2)}
  /*]]>*/ 
  
  .cBtn,label{display:block}body{background-color:#f5f5f5}.video-report-form{max-width:400px;margin:50px auto auto;padding:20px;background-color:#fff;border-radius:8px;box-shadow:0 0 10px rgba(0,0,0,.2)}label{font-weight:700;color:#555}input[type=email],input[type=url],input[type=number],input[type=text],select[type=text],textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;box-sizing:border-box;margin-top:8px;margin-bottom:20px;font-size:15px;transition:border-color .3s ease-in-out}.cInpt:focus,.cMsg:focus{outline:0;border-color:#4caf50}.cBtn{width:100%;padding:10px;margin-top:20px;background-color:#da2323;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:16px;box-shadow:0 4px 6px rgba(0,0,0,.3);transition:background-color .3s ease-in-out}.cBtn:hover{background-color:#ffad00}
</style>

<!--[ Toast Notification ]-->
<div id='toastNotifC' class='tNtf'></div>

<script>
  /*<![CDATA[*/
  /* Toast */ function toast(e){var tNotif = document.getElementById('toastNotifC'); if (tNotif != null){tNotif.innerHTML = '<span>' + e + '</span>'}};
  /*]]>*/
</script>


<div class='video-report-form'>
  <h2 style="margin-bottom: 20px; text-align: center;">Report Video</h2> 

  <form name='cForm'>
    <div class='cArea'>
      <label>Select an Issue:</label>
      <select class='cInpt cSelect' name='issue' id='issue' type='text' required>
        <option value="" disabled selected>Select an option</option>
        <option value="Video Not Displaying">Video Not Displaying</option>
        <option value="Sound Not Comming">Sound Not Comming</option>
        <option value="Buffering">Buffering</option>
        <option value="Other">Other</option>
      </select>
    </div>

   <div class='cArea'>
      <label>Page Link:</label>
      <input class='cInpt cUrl' name='url' id='url' type='url' placeholder='Where you are facing problem (Required)' required />
    </div>
    
    <div class='cArea'>
      <label>Your Name:</label>
      <input class='cInpt cName' name='name' id='name' type='text' placeholder='Your Name (Required)' required />
    </div>

    <div class='cArea'>
      <label>Your Email:</label>
      <input class='cInpt cMail' name='email id' id='email' type='email' placeholder='Your Gmail Address (Required)' required />
    </div>

    <div class='cArea'>
      <label>Other Problem:</label>
      <textarea style='resize:vertical' class='cInpt cMsg' name='message' id='message' rows='3' placeholder='Must not contain more than 3000 characters' required></textarea>
    </div>

    <div class='cArea'>
      <button class='cBtn button' type='submit'>
        <i class="fas fa-exclamation-triangle"></i> <b>Report</b>
      </button>
    </div>
  </form>
</div>
