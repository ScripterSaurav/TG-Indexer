{% include 'header.html' %}

<style>
  header,
  footer {
    display: none !important;
    visibility: hidden !important;
  }
</style>

<div class="min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 bg-gray-100 dark:bg-gray-900 transition-colors duration-300">
  <div class="max-w-md w-full bg-white dark:bg-gray-800 p-8 rounded-2xl shadow-2xl space-y-8 transition-all duration-300">
    <div class="text-center">
      <h2 class="text-3xl font-bold text-gray-900 dark:text-green-400 tracking-wide">Welcome Back</h2>
      <p class="text-gray-400 text-sm">Sign in to continue your cinematic journey</p>
    </div>
        {% if error %}
        <div class="text-center text-xl text-red-500 p-2 border-l-4 border-red-500">
            {{ error }}
        </div>
        {% endif %}
        <form class="space-y-6" action="/login" method="POST">
      <input type="hidden" name="remember" value="true">
      <input type="hidden" name="redirect_to" value="">

      <div class="space-y-4">
        <!-- Username -->
        <div>
          <label for="email-address" class="sr-only">Username</label>
          <input id="email-address" name="username" type="text" required
            class="appearance-none block w-full px-4 py-3 border border-gray-300 dark:border-gray-700 rounded-lg shadow-sm placeholder-gray-500 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm dark:bg-gray-700 transition-colors"
            placeholder="username">
        </div>

        <!-- Password with toggle -->
        <div class="relative">
          <label for="password" class="sr-only">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required
            class="appearance-none block w-full px-4 py-3 border border-gray-300 dark:border-gray-700 rounded-lg shadow-sm placeholder-gray-500 text-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm dark:bg-gray-700 transition-colors"
            placeholder="password">

          <span id="password-toggle"
            class="absolute inset-y-0 right-0 pr-4 flex items-center cursor-pointer select-none" style="-webkit-tap-highlight-color: transparent;">
            <svg id="eye-open" class="h-5 w-5 text-gray-500 dark:text-gray-400" viewBox="0 0 24 24">
              <path
                d="M12,9A3,3 0 0,0 9,12A3,3 0 0,0 12,15A3,3 0 0,0 15,12A3,3 0 0,0 12,9M12,17A5,5 0 0,1 7,12A5,5 0 0,1 12,7A5,5 0 0,1 17,12A5,5 0 0,1 12,17M12,4.5C7,4.5 2.73,7.61 1,12C2.73,16.39 7,19.5 12,19.5C17,19.5 21.27,16.39 23,12C21.27,7.61 17,4.5 12,4.5Z" />
            </svg>
            <svg id="eye-closed" class="h-5 w-5 text-gray-500 dark:text-gray-400 hidden" viewBox="0 0 24 24">
              <path
                d="M11.83,9L15,12.16C15,12.11 15,12.05 15,12A3,3 0 0,0 12,9C11.94,9 11.89,9 11.83,9M7.53,9.8L9.08,11.35C9.03,11.56 9,11.77 9,12A3,3 0 0,0 12,15C12.22,15 12.44,14.97 12.65,14.92L14.2,16.47C13.53,16.8 12.79,17 12,17A5,5 0 0,1 7,12C7,11.21 7.2,10.47 7.53,9.8M2,4.27L4.28,6.55L4.73,7C3.08,8.3 1.78,10 1,12C2.73,16.39 7,19.5 12,19.5C13.55,19.5 15.03,19.2 16.38,18.66L16.81,19.08L19.73,22L21,20.73L3.27,3M12,7A5,5 0 0,1 17,12C17,12.64 16.87,13.26 16.64,13.82L19.57,16.75C21.07,15.5 22.27,13.86 23,12C21.27,7.61 17,4.5 12,4.5C10.6,4.5 9.26,4.75 8,5.2L10.17,7.35C10.74,7.13 11.35,7 12,7Z" />
            </svg>
          </span>
        </div>
      </div>

      <!-- Submit Button -->
      <div>
        <button type="submit"
          class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-semibold rounded-lg text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-4 focus:ring-indigo-400 dark:bg-red-700 dark:hover:bg-red-800 dark:focus:ring-red-600 transition-transform transform hover:scale-105 duration-200">
          <i class="fas fa-unlock-alt mr-2"></i> Sign in
        </button>
      </div>
    </form>

    <div class="text-center text-sm text-gray-400">
      Don’t have an account?
      <a href="#register" class="text-red-400 hover:text-red-300 font-medium">Join Now</a>
    </div>
    
  </div>
</div>


{% include 'footer.html' %}

<script>
    const passwordInput = document.getElementById('password');
    const passwordToggle = document.getElementById('password-toggle');
    const eyeOpen = document.getElementById('eye-open');
    const eyeClosed = document.getElementById('eye-closed');

    passwordToggle.addEventListener('click', () => {
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            eyeOpen.style.display = 'none';
            eyeClosed.style.display = 'block';
        } else {
            passwordInput.type = 'password';
            eyeOpen.style.display = 'block';
            eyeClosed.style.display = 'none';
        }
    });
</script>
