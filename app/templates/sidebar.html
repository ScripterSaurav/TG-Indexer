<style>
    /* Sidebar Styling */
    #sidebar {
      width: 240px;
      position: fixed;
      left: -240px;
      top: 0;
      height: 100%;
      background: linear-gradient(145deg, #333, #1a73e8);
      color: #f5f5f5;
      transition: left 0.4s ease;
      box-shadow: 2px 0 12px rgba(0, 0, 0, 0.8);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      border-top-right-radius: 18px;
      border-bottom-right-radius: 18px;
    } 
    
    /* Overlay styles */
    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(5px);
      visibility: hidden;
      opacity: 0;
      transition: visibility 0.3s, opacity 0.3s;
      z-index: 9999; /* Ensure it appears below the sidebar */
    }
    
    #overlay.active {
      visibility: visible;
      opacity: 1;
    }
    
    .dark #sidebar{
      background: #171717;
    }
    
    /* Sidebar Header */
    .sidebar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      height: 60px; /* Fixed height */
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
    }
    
    .sidebar-header h3 {
      font-weight: 600;
      color: #f5f5f5;
      margin: 0;
      flex-grow: 1; /* Ensures h3 takes available space */
    }
    
    /* Close Button */
    .close-btn {
      position: absolute;
      top: 5px;
      right: 5px;
      font-size: 20px;
      cursor: pointer;
      color: #b0bec5;
      transition: color 0.3s ease;
    }
    
    .close-btn:hover {
      color: #f5f5f5;
    }
    
    /* Sidebar Content Wrapper */
    .sidebar-content {
      overflow-y: auto;
      padding-top: 5px;
      flex-grow: 1;
    }
    
    /* Sidebar Links */
    #sidebar a {
      padding: 10px 18px;
      text-decoration: none;
      font-size: 13px;
      color: #b0bec5;
      display: flex;
      align-items: center;
      transition: background-color 0.3s, color 0.3s, transform 0.3s;
      margin: 5px 12px;
      border-radius: 6px;
    }
    
    #sidebar a:hover {
      background-color: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      transform: translateX(8px);
    }
    
    #sidebar a .link-content {
      display: flex;
      align-items: center;
      width: 100%;
    }
    
    #sidebar a i {
      margin-right: 12px;
      font-size: 20px;
    }
    
    /* Submenu Styling */
    .submenu {
      display: none;
      padding-left: 15px;
      border-left: 2px solid rgba(255, 255, 255, 0.2);
      margin-left: 10px;
    }
    
    .submenu a {
      padding: 8px 0;
      font-size: 14px;
      color: #b0bec5;
    }
    
    /* Sidebar Footer */
    .sidebar-footer {
      text-align: center;
      font-size: 13px;
      padding: 12px 0;
      color: #b0bec5;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    /* Open Sidebar Animation */
    .open {
      left: 0 !important;
    }
    
    /* SVG Icon Styling */
    .submenu-toggle-icon {
      width: 18px;
      height: 18px;
      margin-left: auto;
      transition: transform 0.3s ease;
    } 
    
    /* Submenu arrow tree SVG Icon */
    .arrow-icon {
      width: 18px;
      height: 18px;
      margin-right: 12px;
      color: currentColor;
    }
    
    /* New SVG Icon Styling */
    .main-icon {
      width: 24px;
      height: 24px;
      margin-right: 12px;
      color: currentColor;
    }
    
    /* Rotate icon on submenu open */
    .submenu-open .submenu-toggle-icon {
      transform: rotate(90deg);
    }
</style>

<!-- JavaScript to control sidebar and submenu -->
<script>
    function openSidebar() {
      document.getElementById('sidebar').classList.add('open');
      document.getElementById('overlay').classList.add('active');
    }
    
    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('overlay').classList.remove('active');
    }
    
    // Toggle submenus and rotate icon
    document.querySelectorAll('.menu-item').forEach(item => {
      item.addEventListener('click', function() {
        const submenu = document.getElementById(item.getAttribute('data-submenu'));
        submenu.style.display = submenu.style.display === 'block' ? 'none' : 'block';
        
        // Toggle class for rotating icon
        item.classList.toggle('submenu-open');
      });
    });
</script>
