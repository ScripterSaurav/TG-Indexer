{% include 'header.html' %}

<!-- Margin from Top Header for Body -->
<div style="margin-top: 70px;"></div>
<!-- End -->


<div class="mx-auto my-1 p-1 w-full">
    <div class="flex flex-wrap gap-4 justify-center w-full">
        {% for chat in chats %}
        <a title="{{chat.name}}" href="/{{chat.page_id}}"
            class="justify-items-center min-h-full w-5/12 sm:w-1/4 md:w-1/5 lg:w-1/6 rounded p-2 text-center break-words shadow hover:shadow-md hover:bg-blue-100 bg-white dark:bg-gray-900 dark:hover:bg-gray-500 relative" style="border-radius: 10px;">

            <!-- Lock Icon for Locked Chats -->
            {% if chat.is_locked %}
            <div class="absolute top-2 right-2 bg-yellow-500 rounded-full p-1" title="This channel requires a password">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-white" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd" />
                </svg>
            </div>
            {% endif %}

            <img src="/{{chat.page_id}}/logo?big=1" alt="Logo" class="w-full rounded-full" style="height: 150px; width: 150px;">
            <div class="p-1 mt-2 w-full rounded text-white bg-blue-500 dark:bg-gray-500">{{chat.name}}</div>

        </a>
        {% endfor %}
    </div>
</div>

{% include 'footer.html' %}
