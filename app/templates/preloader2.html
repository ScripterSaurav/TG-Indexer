<style>
/* Full-screen preloader container */
.preloader2 {
  position: fixed;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background: black; /* Gradient for modern feel */
  z-index: 9999;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  animation: fadeIn 0.7s ease-in-out; /* Smooth fade-in */
}

/* Smooth fade-in animation */
@keyframes fadeIn {
  from { opacity: 2; }
  to { opacity: 1; }
}

/* Enhanced circular loader with pulsing effect */
.loader {
  margin-top: 30px;
  border: 5px solid rgba(255, 255, 255, 0.3); /* Semi-transparent gray border */
  border-top: 5px solid red; /* White border for rotating effect */
  border-radius: 50%;
  width: 50px;
  height: 50px;
  animation: spin 1.2s linear infinite; /* Spin and pulse animation */
}

/* Spin animation for loader */
@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
</style>

<div class="preloader2">
  <div class="loader"></div> <!-- Optional spinning loader -->
</div>

<script>
// Hide the preloader after the entire page is loaded
    window.addEventListener('load', function () {
      document.querySelector('.preloader2').style.display = 'none';
    });
</script>
