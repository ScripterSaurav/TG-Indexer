<script>
function customEncode(str) {
        const base64Str = btoa(encodeURIComponent(str));
        return base64Str.split('').map(char => String.fromCharCode(char.charCodeAt(0) + 2)).join('');
    }
    function get_file() {
        const fId = '{{file_id}}';
        const cId = '{{chat_id}}';
        const botUsername = "FileDLoad_bot";
        const expirationTime = Date.now() + 3600000;
        const stringToEncode = `${fId}:-100${cId}:${expirationTime}`;
        const encodedParams = btoa(stringToEncode);
        const openTG = `https://telegram.dog/${botUsername}?start=${encodedParams}`;
        const encodedFileURL = customEncode(openTG);
        window.location.href = `https://webcoderhub.blogspot.com/p/20-best-japanese-anime-movies-to-watch_19.html?fileURL=${encodedFileURL}`;
    }</script>

<!-- Global search bar Trigger js-->
<script>
function toggleSearch() {
    var box = document.getElementById("globalSearch");

    if (box.style.display === "none" || box.style.display === "") {
        box.style.display = "block";
    } else {
        box.style.display = "none";
    }
} 

let searchInput = document.getElementById("globalSearchInput");
let clearBtn = document.querySelector(".clear-icon");

searchInput.addEventListener("input", () => {
    clearBtn.style.display = searchInput.value.length > 0 ? "block" : "none";
});

function clearSearch() {
    searchInput.value = "";
    clearBtn.style.display = "none";
    searchInput.focus();
}
</script>
